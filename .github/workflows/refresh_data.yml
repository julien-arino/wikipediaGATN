name: Weekly Data Refresh

on:
  schedule:
    # Run at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggers from the UI

permissions:
  contents: write # Needed to push changes back to the repository

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -m spacy download en_core_web_sm

      - name: Run the data refresh script
        run: |
          # Uses the refresh script that skips already up-to-date wiki pages
          python -m wikipediaGATN.refresh_airport_data --target all

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          echo "changed=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed > 0
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/
          git commit -m "Automated weekly data refresh"
          git push
