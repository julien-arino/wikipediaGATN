name: Weekly Data Refresh

# Re-scrapes Wikipedia, rebuilds the published networks, validates the result
# against the committed baseline, and — only if it passes — opens (or updates) a
# pull request with the refreshed data instead of pushing straight to main.
#
# Why a pull request instead of a direct push?
#   * The refreshed data goes through the same CI and review as any other
#     change, so a bad scrape cannot silently land on main.
#   * scripts/validate_refresh.py is a hard gate: a run that loses hubs, nodes,
#     or routes aborts before any PR is opened.
#
# Activation (dormant until configured — see docs/maintenance.md):
#   * Add a repository secret named REFRESH_DATA_PAT (a fine-grained PAT with
#     "Contents: read/write" and "Pull requests: read/write" on this repo). A
#     PAT is required — pull requests opened with the default GITHUB_TOKEN do
#     not trigger CI, so the validation/test checks would never run on them.
#   * Optionally enable "Allow auto-merge" and a branch-protection rule
#     requiring the test workflow, so a green refresh PR merges itself.
# Until the secret exists the build-and-validate steps still run on the weekly
# schedule, but the "open pull request" step fails (no token), so nothing is
# published — the workflow is effectively dormant.

on:
  schedule:
    # Run at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggers from the UI

permissions:
  contents: write # peter-evans/create-pull-request needs to push the branch
  pull-requests: write # ... and to open/update the PR

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m spacy download en_core_web_sm

      - name: Snapshot the committed baseline
        # Copy the currently committed data aside so the validator can compare
        # the rebuild against it after the refresh overwrites data/public.
        run: |
          mkdir -p "${RUNNER_TEMP}/baseline"
          cp -R data/public "${RUNNER_TEMP}/baseline/public"

      - name: Run the data refresh script
        run: |
          # Uses the refresh script that skips already up-to-date wiki pages
          python -m wikipediaGATN.refresh_airport_data --target all
          # Rebuilds the global connection lists, adjacency matrices, and graph files
          python -m wikipediaGATN.result_processing_network
          # Updates the interactive HTML visualisations for all generated networks
          python -m wikipediaGATN.visualise_gatn

      - name: Validate the refreshed networks
        # Hard gate: fails the job (and so skips the PR) if the rebuild looks
        # like a scrape regression rather than a genuine update.
        run: |
          python scripts/validate_refresh.py \
            --baseline-dir "${RUNNER_TEMP}/baseline/public" \
            --candidate-dir data/public

      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          echo "changed=$(git status --porcelain | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Create or update the refresh pull request
        id: cpr
        if: steps.git-check.outputs.changed > 0
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.REFRESH_DATA_PAT }}
          add-paths: data/public
          branch: automated/weekly-data-refresh
          delete-branch: true
          commit-message: "Automated weekly data refresh"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "Automated weekly data refresh"
          labels: |
            automated
            data-refresh
          body: |
            Automated weekly refresh of the Wikipedia-derived air-transportation
            network data.

            The rebuilt passenger and cargo networks passed
            `scripts/validate_refresh.py` (no large loss of nodes, edges, or
            top-hub out-degree versus the previous committed data). CI runs on
            this PR as usual; review the diff before merging, or let auto-merge
            land it if branch protection is configured.

            _Generated by the `Weekly Data Refresh` workflow._

      - name: Enable auto-merge on the pull request
        # Best-effort: only takes effect when the repository has "Allow
        # auto-merge" enabled and a required status check configured. Otherwise
        # the PR is simply left open for manual review.
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.REFRESH_DATA_PAT }}
        run: |
          gh pr merge --auto --squash "${{ steps.cpr.outputs.pull-request-number }}" \
            || echo "Auto-merge not enabled; leaving PR #${{ steps.cpr.outputs.pull-request-number }} for manual review."
